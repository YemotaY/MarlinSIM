[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marlinsim-gcode"
version = "0.1.0"
description = "G-code post-processor for 3D print progress animations on Marlin 2.x"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.8"
authors = [
    {name = "MarlinSIM Contributors"}
]
keywords = ["3d-printing", "marlin", "gcode", "animation", "progress"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
]
dependencies = []

[project.scripts]
marlinsim-gcode = "marlinsim.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["marlinsim*"]
